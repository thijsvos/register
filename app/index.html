<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* boot into the OS scheme before first paint — no flash, no stored state */
      if (matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add('dark')
    </script>

      rel="preload"
      href="/fonts/commit-mono/commit-mono-latin-400-normal.woff2"
      as="font"
      type="font/woff2"

    />

      rel="preload"
      href="/fonts/commit-mono/commit-mono-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/departure-mono/departure-mono-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
