name: CI
on: [push, pull_request]
jobs:
  ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6          # reads packageManager field
        with: { package_json_file: app/package.json }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check          # biome + svelte-check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable  # rust-toolchain.toml governs
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      # --all-targets so the test modules are linted too; --locked mirrors the
      # UI job's --frozen-lockfile.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  repo-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }       # shallow clone would measure the tree, not the repo
      - run: |
          KB=$(git count-objects -v | awk '/size-pack/ {print $2}')
          echo "pack ${KB} KB"; test "$KB" -lt 5120
