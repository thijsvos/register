name: CI
on: [push, pull_request]
jobs:
  ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6          # reads packageManager field
        with: { package_json_file: app/package.json }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check          # biome + svelte-check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable  # rust-toolchain.toml governs
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      # --all-targets so the test modules are linted too; --locked mirrors the
      # UI job's --frozen-lockfile.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  repo-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }       # shallow clone would measure the tree, not the repo
      - run: |
          set -euo pipefail
          KB=$(git count-objects -v | awk '/size-pack/ {print $2}')
          echo "pack ${KB} KB of 5120 KB"
          # A clone that was never packed reports 0, and `0 -lt 5120` is a pass
          # that measured nothing. Refuse to call that green.
          test -n "$KB" && test "$KB" -gt 0
          test "$KB" -lt 5120
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # §03 and CLAUDE.md rule 7: "CI greps for strays". `app/src/doctrine.test.ts`
      # polices the inside of app/public/fonts and cannot see a face committed
      # anywhere else, which is the case that matters — BYOF means a licensed
      # font belongs in the user's vault and nowhere a `git push` can take it.
      - name: no font outside app/public/fonts, and no licensed face anywhere
        run: |
          set -euo pipefail
          # Tracked files, not the working tree: what a push carries is what is
          # tracked, and the working tree holds an ignored .register/fonts/.
          STRAY=$(git ls-files | grep -iE '\.(woff2?|ttf|otf|eot)$' | grep -v '^app/public/fonts/' || true)
          if [ -n "$STRAY" ]; then
            echo "font files outside app/public/fonts:"; echo "$STRAY"; exit 1
          fi
          # By name as well as by extension: a licensed face arrives as a .zip or
          # a glyph dump long before it arrives as a .otf.
          LICENSED=$(git ls-files | grep -iE 'berkeley|tx-?02' || true)
          if [ -n "$LICENSED" ]; then
            echo "a licensed face is tracked:"; echo "$LICENSED"; exit 1
          fi
          # A grep that finds nothing reads the same whether the rule holds or
          # the pattern is broken. Prove the sanctioned faces are still matched.
          SANCTIONED=$(git ls-files 'app/public/fonts/*' | grep -icE '\.woff2$' || true)
          test "$SANCTIONED" -gt 0
          echo "PASS: $SANCTIONED sanctioned faces, no strays"
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { package_json_file: app/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
        working-directory: app
      # The UI is embedded in the binary, so it is built before the binary is.
      - run: pnpm build
        working-directory: app
      - run: cargo build --release --locked
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: app
      # §06's browser budgets: agent-edit ≤ 100 ms, doc switch < 16 ms, start →
      # editable < 500 ms, idle RSS ≤ 50 MB, plus the keyboard and motion audit.
      - run: pnpm e2e
        working-directory: app
      - uses: actions/upload-artifact@v5
        if: failure()
        with: { name: playwright-traces, path: app/test-results, retention-days: 7 }
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Installed rather than pulled from a third-party action: this repo has
      # four crate dependencies and the point of the job is supply chain.
      - run: cargo install cargo-audit --locked
      # The check that would have found RUSTSEC-2025-0068 — the unsound
      # `serde_yml` — without ADR-001 having to find it by reading advisories.
      - run: cargo audit --deny warnings
