name: CI
# `on: [push, pull_request]` ran the whole matrix twice for any branch with a PR
# open — same commit, same answer, twice the minutes. Pushes are checked on main;
# everywhere else the pull_request event is the one that matters.
on:
  push:
    branches: [main]
    # release.yml states that the gates run alongside it rather than being
    # restated there, and that is only true while a tag push reaches this
    # workflow. A bare `push:` used to catch tags for free; a `branches:` filter
    # does not, and would have cut a release with nothing checking it.
    tags: ["v[0-9]*"]
  pull_request:

# This repository is public, so these jobs run code from strangers. Nothing here
# writes anything back, and the default is whatever the repo setting happens to
# be — which is not a thing to leave to a setting.
permissions:
  contents: read

# A second push while the first is still building makes the first answer
# irrelevant, not interesting.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6          # reads packageManager field
        with: { package_json_file: app/package.json }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check          # biome + svelte-check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable  # rust-toolchain.toml governs
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      # --all-targets so the test modules are linted too; --locked mirrors the
      # UI job's --frozen-lockfile.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  repo-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }       # shallow clone would measure the tree, not the repo
      - run: |
          set -euo pipefail
          KB=$(git count-objects -v | awk '/size-pack/ {print $2}')
          echo "pack ${KB} KB of 5120 KB"
          # A clone that was never packed reports 0, and `0 -lt 5120` is a pass
          # that measured nothing. Refuse to call that green.
          test -n "$KB" && test "$KB" -gt 0
          test "$KB" -lt 5120
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # §03 and CLAUDE.md rule 7: "CI greps for strays". `app/src/doctrine.test.ts`
      # polices the inside of app/public/fonts and cannot see a face committed
      # anywhere else, which is the case that matters — BYOF means a licensed
      # font belongs in the user's vault and nowhere a `git push` can take it.
      - name: no font outside app/public/fonts, and no licensed face anywhere
        run: |
          set -euo pipefail
          # One pattern, used by both the check and its own proof. Writing the
          # guard against `\.woff2$` while the check used the alternation meant a
          # break in the alternation left the guard happy and the job green.
          FONTS='\.(woff2?|ttf|otf|eot)$'
          # Tracked files, not the working tree: what a push carries is what is
          # tracked, and the working tree holds an ignored .register/fonts/.
          STRAY=$(git ls-files | grep -iE "$FONTS" | grep -v '^app/public/fonts/' || true)
          if [ -n "$STRAY" ]; then
            echo "font files outside app/public/fonts:"; echo "$STRAY"; exit 1
          fi
          # By name as well as by extension: a licensed face arrives as a .zip or
          # a glyph dump long before it arrives as a .otf.
          LICENSED=$(git ls-files | grep -iE 'berkeley|tx-?02' || true)
          if [ -n "$LICENSED" ]; then
            echo "a licensed face is tracked:"; echo "$LICENSED"; exit 1
          fi
          # A grep that finds nothing reads the same whether the rule holds or
          # the pattern is broken. Prove the same pattern still matches the
          # faces that are supposed to be there.
          SANCTIONED=$(git ls-files 'app/public/fonts/*' | grep -icE "$FONTS" || true)
          test "$SANCTIONED" -gt 0
          echo "PASS: $SANCTIONED sanctioned faces, no strays"
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { package_json_file: app/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
        working-directory: app
      # The UI is embedded in the binary, so it is built before the binary is.
      - run: pnpm build
        working-directory: app
      - run: cargo build --release --locked
      # Two engines here, three locally. §02's plate scale is `zoom` on <html>
      # interacting with `dvh`, which is exactly where engines differ, and
      # `scale.spec.ts` was proving it in the one least likely to disagree.
      #
      # WebKit is deliberately not gated on. Playwright's Linux "webkit" is the
      # WebKitGTK port rather than Safari, and gating on it tests the port: it
      # failed three specs here — a document switch at 255 ms against 250, a
      # conflict copy that never appeared inside five seconds, and a wheel
      # gesture — every one of which passes in macOS WebKit, which is the engine
      # a Safari reader actually runs. The project stays in `playwright.config.ts`
      # so `pnpm e2e --project=webkit` on a Mac is one command.
      - run: pnpm exec playwright install --with-deps chromium firefox
        working-directory: app
      # §06's browser budgets: agent-edit ≤ 100 ms, doc switch < 16 ms, start →
      # editable < 500 ms, idle RSS ≤ 50 MB, plus the keyboard and motion audit.
      - run: pnpm e2e --project=chromium --project=firefox
        working-directory: app
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-traces, path: app/test-results, retention-days: 7 }
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with: { package_json_file: app/package.json }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      # Installed rather than pulled from a third-party action: this repo has
      # four crate dependencies and the point of the job is supply chain.
      # Pinned: a gate that installs an unpinned tool on every run is a gate
      # whose behaviour a third party can change without a commit here.
      # Renovate tracks this the same as any other pin.
      - run: cargo install cargo-audit --version 0.22.2 --locked
      # The check that would have found RUSTSEC-2025-0068 — the unsound
      # `serde_yml` — without ADR-001 having to find it by reading advisories.
      #
      # `unsound` and `yanked` rather than the blanket `warnings`: that also
      # denies `unmaintained`, which fires on transitive crates nobody here can
      # act on and turns every unrelated PR red. A gate that is red for reasons
      # the contributor cannot fix is a gate people learn to ignore. Real
      # vulnerabilities still fail the build — that is cargo-audit's default.
      - run: cargo audit --deny unsound --deny yanked
      # The 7 runtime npm packages ship inside the binary too, and nothing was
      # checking them at all. Prod only: a dev-tree advisory is not in the
      # artefact.
      - run: pnpm audit --prod --audit-level high
        working-directory: app
