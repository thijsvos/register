version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly }
    groups: { app-deps: { patterns: ["*"] } }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups: { server-deps: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
